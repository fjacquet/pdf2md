version: 2

project_name: pdf2md

before:
  hooks:
    - go mod tidy

builds:
  # CGO is required: github.com/yalue/onnxruntime_go wraps the native
  # ONNX Runtime library via cgo/dlopen. We use goreleaser-cross in the
  # release workflow so each (os, arch) pair gets its own toolchain.
  - id: pdf2md-darwin-amd64
    main: ./cmd/pdf2md
    binary: pdf2md
    env:
      - CGO_ENABLED=1
      - CC=o64-clang
      - CXX=o64-clang++
    goos: [darwin]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: &ldflags
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: pdf2md-darwin-arm64
    main: ./cmd/pdf2md
    binary: pdf2md
    env:
      - CGO_ENABLED=1
      - CC=oa64-clang
      - CXX=oa64-clang++
    goos: [darwin]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags: *ldflags

  - id: pdf2md-linux-amd64
    main: ./cmd/pdf2md
    binary: pdf2md
    env:
      - CGO_ENABLED=1
      - CC=x86_64-linux-gnu-gcc
    goos: [linux]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: *ldflags

  - id: pdf2md-linux-arm64
    main: ./cmd/pdf2md
    binary: pdf2md
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
    goos: [linux]
    goarch: [arm64]
    flags: [-trimpath]
    ldflags: *ldflags

  - id: pdf2md-windows-amd64
    main: ./cmd/pdf2md
    binary: pdf2md
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
    goos: [windows]
    goarch: [amd64]
    flags: [-trimpath]
    ldflags: *ldflags

archives:
  - id: pdf2md
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CLAUDE.md
      - docs/**/*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-dev+{{ .ShortCommit }}"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?(feat|add)(\(.+\))?!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?(fix|bug)(\(.+\))?!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: fjacquet
    name: pdf2md
  draft: false
  prerelease: auto
  header: |
    ## pdf2md {{ .Tag }}

    Pure-Go PDF → Markdown converter for RAG pipelines and Obsidian.
  footer: |
    ---

    **Runtime dependencies** (optional, for ML features):
    - ONNX Runtime — for layout detection and OCR. See the README for install notes.

    Thanks for using pdf2md!
